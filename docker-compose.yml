services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: exhibitor_scraper
      POSTGRES_PASSWORD: exhibitor_scraper
      POSTGRES_DB: exhibitor_scraper
    ports:
      - "5432:5432"
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U exhibitor_scraper -d exhibitor_scraper"]
      interval: 5s
      timeout: 5s
      retries: 10

  app:
    build: .
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql://exhibitor_scraper:exhibitor_scraper@db:5432/exhibitor_scraper
      NODE_ENV: production
    ports:
      - "3000:3000"
    depends_on:
      db:
        condition: service_healthy

volumes:
  db-data:
